<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spacetime History</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --panel2: #efede8; --fg: #1d1c1a; --muted: #6b6862; --line: #dedad2;
  --accent: #e8730c; --accent-fg: #ffffff; --ok: #1f9d55; --warn: #c2410c; --grid: #ebe7df; --sel: #2563eb;
  --n-yellow: #fde68a; --n-pink: #fbcfe8; --n-green: #bbf7d0; --n-blue: #bfdbfe; --n-red: #fecaca; --note-fg: #1d1c1a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121316; --panel: #1b1d21; --panel2: #23262b; --fg: #ecebe8; --muted: #9a978f; --line: #2d3036;
    --accent: #ff8a2a; --accent-fg: #1b1206; --ok: #3ddc84; --warn: #ff9a5c; --grid: #202328; --sel: #60a5fa;
    --n-yellow: #b8932a; --n-pink: #b05c8a; --n-green: #3f8f5c; --n-blue: #3f6fb0; --n-red: #b35050; --note-fg: #fbfaf7;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 17px; margin: 0; font-weight: 650; }
#status { font-size: 13px; color: var(--ok); }
#status.bad { color: var(--warn); }
#me { margin-left: auto; font-size: 13px; color: var(--muted); }
.layout { display: grid; grid-template-columns: 1fr 360px; gap: 0; min-height: calc(100vh - 53px); }
main { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 13px; border-radius: 999px; cursor: pointer; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
.hint { color: var(--muted); font-size: 12px; }
#board { position: relative; width: 100%; aspect-ratio: 16 / 10; background-color: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 5% 8%; touch-action: none; }
#board.past { outline: 3px solid var(--accent); outline-offset: -3px; }
.note { position: absolute; width: 16%; min-height: 15%; padding: 8px 10px; border-radius: 6px; color: var(--note-fg); box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: grab; user-select: none; font-size: 13px; overflow-wrap: anywhere; transition: box-shadow 0.1s; }
.note.sel { box-shadow: 0 0 0 3px var(--sel), 0 2px 6px rgba(0,0,0,0.15); }
.note.flash { animation: flash 0.9s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 6px var(--accent); } }
#board.past .note { cursor: default; }
.timebar { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.timebar input { flex: 1; accent-color: var(--accent); }
#when { font-variant-numeric: tabular-nums; min-width: 150px; font-size: 13px; }
aside { border-left: 1px solid var(--line); background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0; }
#log { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: calc(100vh - 140px); }
.entry { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--bg); cursor: pointer; }
.entry .top { display: flex; gap: 6px; align-items: baseline; }
.entry .who { font-weight: 600; }
.entry .when { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.entry .what { color: var(--muted); font-size: 12px; margin-top: 2px; }
.tag { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--panel2); color: var(--muted); }
.tag.undo { color: var(--warn); }
.tag.redo { color: var(--ok); }
#toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; pointer-events: none; transition: 0.15s; max-width: 90vw; }
#toast.show { opacity: 1; }
[hidden] { display: none !important; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;color:var(--accent)"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 3"/></svg> Spacetime History</h1>
  <span id="status">connecting…</span>
  <span id="me"></span>
</header>
<div class="layout">
  <main>
    <div class="toolbar">
      <button class="btn primary" id="add">Add note</button>
      <span class="sep"></span>
      <span class="hint">Color:</span>
      <span id="swatches"></span>
      <button class="btn" id="delete" disabled>Delete</button>
      <span class="sep"></span>
      <button class="btn" id="undo" disabled title="Ctrl+Z">Undo</button>
      <button class="btn" id="redo" disabled title="Ctrl+Shift+Z">Redo</button>
      <span class="hint" id="undo-hint"></span>
    </div>
    <div id="board"></div>
    <div class="timebar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <input id="time" type="range" min="0" max="1000" value="1000" title="Scrub through history">
      <span id="when">Live</span>
      <button class="btn" id="live" hidden>Back to live</button>
    </div>
    <div class="hint">Drag notes to move them (shift-click to select several), double-click to edit. Undo and redo are yours alone, and refuse if someone else changed the same note since.</div>
  </main>
  <aside>
    <h2>Activity</h2>
    <div id="log"></div>
  </aside>
</div>
<div id="toast"></div>
